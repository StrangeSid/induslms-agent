[project]
name = "induslms-agent"
version = "0.4.0"
description = "Agent access to Indus LMS academics: assignments, results, tasks, messages, resources, attendance, with confirmed writes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "IndusLMS Agent contributors" }]
keywords = ["lms", "mcp", "education", "school", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
  "requests>=2.31",
  "mcp>=1.0,<2",
  "msal>=1.30",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/StrangeSid/induslms-agent"
Repository = "https://github.com/StrangeSid/induslms-agent"
Issues = "https://github.com/StrangeSid/induslms-agent/issues"

[project.scripts]
induslms = "lms:main"
induslms-server = "server:main"
induslms-outlook = "outlook:main"
induslms-mailapp = "mailapp:main"
induslms-sharepoint = "sharepoint:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["lms", "server", "outlook", "mailapp", "sharepoint"]
